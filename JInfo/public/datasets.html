<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="theme-color" content="#f2f0e8" /><meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="description" content="省庁が公開する統計、白書、CSV、PDFなどの行政オープンデータを横断検索できます。" />
    <link rel="canonical" href="https://jinfo.rollprojects.com/datasets" /><link rel="icon" href="/favicon.svg" type="image/svg+xml" /><link rel="stylesheet" href="/styles.css?v=8" />
    <title>行政オープンデータ検索｜JInfo</title>
  </head>
  <body data-page="datasets">
    <a class="skip-link" href="#main">本文へ移動</a>
    <header class="app-header"><a class="brand" href="/"><span class="brand-symbol">J</span><span><strong>INFO</strong><small>公共情報ツール</small></span></a><nav class="app-nav"><a href="/">防災</a><a href="/laws">法令</a><a href="/map">地図</a><a class="active" href="/datasets">行政データ</a><a href="/books">図書</a></nav><div class="live-clock"><span class="live-dot"></span><span id="current-time">JST --:--</span></div></header>
    <main class="app-main" id="main">
      <section class="page-heading"><div><p class="eyebrow">e-Gov データポータル</p><h1>行政データ検索</h1></div><p>各省庁が公開する統計、白書、CSV、PDFなどをまとめて探せます。</p></section>
      <form class="search-panel gold-panel" id="dataset-form"><label for="dataset-query">探したいテーマ</label><div class="search-row"><input id="dataset-query" name="q" type="search" value="防災" maxlength="80" autocomplete="off" /><button type="submit">検索 <span>→</span></button></div><div class="suggestions"><span>例</span><button type="button" data-target="dataset-query">人口</button><button type="button" data-target="dataset-query">観光</button><button type="button" data-target="dataset-query">教育</button><button type="button" data-target="dataset-query">環境</button></div></form>
      <div class="filter-toolbar" aria-label="行政データ検索の表示設定">
        <label class="filter-search">結果内検索<input id="dataset-result-query" type="search" placeholder="名称・説明・タグ" autocomplete="off" /></label>
        <label>形式<select id="dataset-format-filter"><option value="all">すべて</option><option value="CSV">CSV</option><option value="JSON">JSON</option><option value="PDF">PDF</option><option value="XLSX">Excel</option><option value="HTML">HTML</option></select></label>
        <label>提供元<select id="dataset-organization-filter"><option value="all">すべて</option></select></label>
        <label>更新時期<select id="dataset-date-filter"><option value="all">指定なし</option><option value="1">1年以内</option><option value="3">3年以内</option><option value="5">5年以内</option><option value="10">10年以内</option></select></label>
        <label>並び順<select id="dataset-sort"><option value="relevance">関連度順</option><option value="updated-desc" selected>更新日の新しい順</option><option value="updated-asc">更新日の古い順</option><option value="title">名称順</option></select></label>
        <label>取得件数<select id="dataset-limit"><option value="12">12件</option><option value="25" selected>25件</option><option value="50">50件</option><option value="100">100件</option></select></label>
      </div>
      <div class="result-status" id="dataset-status" aria-live="polite">検索しています。</div><div class="result-grid" id="dataset-results"></div>
    </main>
    <footer class="app-footer"><span>JInfo by RollProjects</span><span>出典：e-Govデータポータル</span></footer><script src="/app.js?v=8" type="module"></script>
  </body>
</html>
