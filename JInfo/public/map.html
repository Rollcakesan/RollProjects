<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="theme-color" content="#198768" />
    <meta name="description" content="国土地理院の標準地図、淡色地図、航空写真を切り替えて閲覧できます。" />
    <link rel="canonical" href="https://jinfo.rollprojects.com/map" /><link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3ynhtEMrzIh9iZ7uTuQtq9fwWCQJk=" crossorigin="anonymous" /><link rel="stylesheet" href="/styles.css?v=6" />
    <title>地理院地図｜標準地図・航空写真｜JInfo</title>
  </head>
  <body data-page="map" class="map-page">
    <a class="skip-link" href="#main">本文へ移動</a>
    <header class="app-header"><a class="brand" href="/"><span class="brand-symbol">J</span><span><strong>INFO</strong><small>公共情報ツール</small></span></a><nav class="app-nav"><a href="/">防災</a><a href="/laws">法令</a><a class="active" href="/map">地図</a><a href="/datasets">行政データ</a><a href="/books">図書</a></nav><div class="live-clock"><span class="live-dot"></span><span id="current-time">JST --:--</span></div></header>
    <main class="map-main" id="main">
      <section class="map-page-tools">
        <div><p class="eyebrow">国土地理院タイル</p><h1>地理院地図</h1><p>地図をクリックすると緯度・経度を表示します。</p></div>
        <form class="map-search" id="map-search-form">
          <label for="map-query">住所・地名を検索</label>
          <div><input id="map-query" name="q" type="search" placeholder="例：見附市嶺崎2-2-3" maxlength="100" autocomplete="street-address" /><button type="submit">検索</button></div>
        </form>
        <p class="map-search-status" id="map-search-status" aria-live="polite"></p>
        <div class="map-search-results" id="map-search-results"></div>
        <div class="map-actions"><button type="button" id="locate-button">◎ 現在地</button><button type="button" data-map-place="35.6812,139.7671,13">東京駅</button><button type="button" data-map-place="35.3606,138.7274,11">富士山</button></div>
        <p class="location-status" id="location-status" role="status" aria-live="polite">現在地ボタンを押すと、ブラウザーが位置情報を確認します。</p>
        <dl class="map-readout"><div><dt>緯度</dt><dd id="map-lat">36.20480</dd></div><div><dt>経度</dt><dd id="map-lng">138.25290</dd></div></dl>
      </section>
      <section class="map-page-frame" aria-label="地理院地図">
        <div class="map-layer-switch"><button type="button" class="active" data-layer="std">標準</button><button type="button" data-layer="pale">淡色</button><button type="button" data-layer="seamlessphoto">航空写真</button></div>
        <div id="map"></div>
      </section>
    </main>
    <footer class="app-footer"><span>JInfo by RollProjects</span><span>出典：国土地理院</span></footer>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script><script src="/app.js?v=6" type="module"></script>
  </body>
</html>
